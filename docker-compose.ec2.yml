name: tatt-staging

services:
  postgres:
    image: postgres:16-alpine
    container_name: tatt-postgres-ec2
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
      POSTGRES_DB: ${DB_NAME:-tatt_db}
    ports:
      - "5432:5432"
    volumes:
      - /data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tatt-network-ec2

  api:
    image: yayamamoudou/tatt-api:staging
    container_name: tatt-api-ec2
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS:-postgres}
      DB_NAME: ${DB_NAME:-tatt_db}
      DB_SYNC: "true"
      JWT_SECRET: ${JWT_SECRET:-dev_secret}
      APP_SECRET: ${APP_SECRET:-app_secret}
      FRONTEND_URL: ${FRONTEND_URL}
      API_BASE_URL: ${API_BASE_URL}
      UPLOAD_DIR: /app/uploads
      UPLOAD_BASE_URL: ${UPLOAD_BASE_URL:-https://staff.theafricanthinktank.org/api}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      S3_ENDPOINT: ${S3_ENDPOINT}
      CORS_ORIGINS: ${CORS_ORIGINS}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: noreply@theafricanthinktank.com
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
    volumes:
      - /data/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tatt-network-ec2

  frontend:
    image: yayamamoudou/tatt-frontend:staging
    container_name: tatt-frontend-ec2
    restart: always
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
    depends_on:
      - api
    networks:
      - tatt-network-ec2

  adminer:
    image: adminer
    container_name: tatt-adminer-ec2
    restart: always
    ports:
      - "8080:8080"
    networks:
      - tatt-network-ec2

networks:
  tatt-network-ec2:
    driver: bridge
